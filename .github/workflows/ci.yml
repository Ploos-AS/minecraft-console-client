name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build amd64 container
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            -t mcc:ci .

      - name: Verify non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id mcc:ci -u)" != "0"

      - name: Verify MCC starts
        run: |
          timeout 15s docker run --rm mcc:ci --help >/tmp/mcc-help.txt 2>&1 || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            cat /tmp/mcc-help.txt
            exit "${rc}"
          fi
          cat /tmp/mcc-help.txt
