name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build amd64 container
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            -t mcc:ci-amd64 .

      - name: Verify non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id mcc:ci-amd64 -u)" = "1000"
          test "$(docker run --rm --entrypoint id mcc:ci-amd64 -g)" = "1000"

      - name: Verify OCI metadata
        run: |
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.source" }}' mcc:ci-amd64)" = "https://github.com/Ploos-AS/minecraft-console-client"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' mcc:ci-amd64)" = "ci"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' mcc:ci-amd64)" = "$GITHUB_SHA"
          test "$(docker inspect -f '{{ index .Config.Labels "io.ploos.mcc.upstream.version" }}' mcc:ci-amd64)" = "20260829-511"

      - name: Verify MCC starts and generates persistent config
        run: |
          tmpdir="$(mktemp -d)"
          chmod 0777 "$tmpdir"
          timeout 15s docker run --rm \
            -v "$tmpdir:/opt/data" \
            mcc:ci-amd64 --help >/tmp/mcc-help.txt 2>&1 || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            cat /tmp/mcc-help.txt
            exit "${rc}"
          fi
          cat /tmp/mcc-help.txt
          test -s "$tmpdir/MinecraftClient.ini"
          grep -q '^\[Main\]' "$tmpdir/MinecraftClient.ini"

      - name: Build arm64 container
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            --load \
            -t mcc:ci-arm64 .

      - name: Verify arm64 MCC starts
        run: |
          test "$(docker image inspect -f '{{ .Architecture }}' mcc:ci-arm64)" = "arm64"
          timeout 30s docker run --rm mcc:ci-arm64 --help >/tmp/mcc-help-arm64.txt 2>&1 || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            cat /tmp/mcc-help-arm64.txt
            exit "${rc}"
          fi
          cat /tmp/mcc-help-arm64.txt
